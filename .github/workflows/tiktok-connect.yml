name: tiktok-connect - local account connection instructions

on:
  workflow_dispatch:

permissions: {}

jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Keep credentials off public Actions
        run: |
          echo 'Account connection is local only. See SECURITY.md.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Never paste authorization codes or tokens into workflow inputs, issues, or logs.' >> "$GITHUB_STEP_SUMMARY"
