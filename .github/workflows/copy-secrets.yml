name: Copy YouTube & Pexels secrets to quran-long-videos (one time)

on:
  workflow_dispatch:

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy (values are never printed)
        env:
          GH_TOKEN: ${{ secrets.COPY_PAT }}
          A1: ${{ secrets.YT_CLIENT_ID }}
          A2: ${{ secrets.YT_CLIENT_SECRET }}
          A3: ${{ secrets.YT_REFRESH_TOKEN }}
          A4: ${{ secrets.YT_CHANNEL_ID }}
          E1: ${{ secrets.EN_YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          E2: ${{ secrets.EN_YT_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
          E3: ${{ secrets.EN_YT_REFRESH_TOKEN }}
          E4: ${{ secrets.EN_YT_CHANNEL_ID }}
          PX: ${{ secrets.PEXELS_API_KEY }}
        run: |
          R=obelixagency/quran-long-videos
          if [ -z "$GH_TOKEN" ]; then echo "COPY_PAT secret is missing"; exit 1; fi
          put() { if [ -n "$2" ]; then printf '%s' "$2" | gh secret set "$1" --repo "$R" && echo "✅ $1"; else echo "⚠️ $1: source secret is empty – skipped"; fi; }
          put AR_YT_CLIENT_ID "$A1"
          put AR_YT_CLIENT_SECRET "$A2"
          put AR_YT_REFRESH_TOKEN "$A3"
          put AR_YT_CHANNEL_ID "$A4"
          put EN_YT_CLIENT_ID "$E1"
          put EN_YT_CLIENT_SECRET "$E2"
          put EN_YT_REFRESH_TOKEN "$E3"
          put EN_YT_CHANNEL_ID "$E4"
          put PEXELS_API_KEY "$PX"
