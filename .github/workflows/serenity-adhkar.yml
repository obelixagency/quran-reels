name: Daily Serenity – adhkar stories

on:
  schedule:
    # UTC. Morning ≈ 6am New York / 11am London; evening ≈ 5pm New York / 10pm London.
    - cron: "13 10 * * *"
    - cron: "13 21 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: "morning / evening"
        default: "morning"
      publish:
        description: "Publish? (false = images only, download from the run page)"
        default: "false"

permissions:
  actions: read
  contents: write

concurrency:
  group: serenity-adhkar
  cancel-in-progress: false

jobs:
  adhkar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard (skip if this time slot already went out)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> $GITHUB_OUTPUT; exit 0; fi
          # a scheduled run that GitHub starts very late (it happens: hours late) is dropped;
          # the watchdog re-runs a missed slot at the right time instead
          CRON='${{ github.event.schedule }}'
          EXP=$(date -u -d "$(date -u +%F) $(echo "$CRON" | awk '{printf "%02d:%02d", $2, $1}')" +%s); NOW=$(date -u +%s)
          if [ "$EXP" -gt "$NOW" ]; then EXP=$((EXP - 86400)); fi
          LATE=$(( (NOW - EXP) / 60 )); echo "cron $CRON started $LATE min late"
          if [ "$LATE" -gt 90 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Too late for this time slot - skipping."; exit 0; fi
          WF=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          SINCE=$(date -u -d '-150 min' +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=success&created=>=$SINCE" --jq '[.workflow_runs[] | select(.event=="schedule" or .triggering_actor.login=="github-actions[bot]")] | length' || echo 0)
          echo "successful scheduled runs since $SINCE: $N"
          if [ "$N" -gt 0 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Already posted for this time slot - skipping."; else echo "skip=0" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - name: Decide what to run
        if: steps.guard.outputs.skip != '1'
        id: plan
        run: |
          EN_ON=$(python3 -c "import json;print(str(json.load(open('config.json')).get('en',{}).get('enabled',False)).lower())")
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$EN_ON" != "true" ]; then echo "Daily Serenity not enabled yet (config.json → en.enabled)"; echo "skip=1" >> $GITHUB_OUTPUT; exit 0; fi
            H=$((10#$(date -u +%H))); if [ $H -lt 16 ]; then S=morning; else S=evening; fi
            echo "args=--session $S --publish" >> $GITHUB_OUTPUT
          else
            A="--session ${{ inputs.session }}"
            [ "${{ inputs.publish }}" = "true" ] && A="$A --publish"
            echo "args=$A" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1' && (steps.plan.outputs.skip != '1')
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.guard.outputs.skip != '1' && (steps.plan.outputs.skip != '1')
        run: pip install -r requirements.txt && python -m src.en.setup_data

      - name: Generate & publish stories
        if: steps.guard.outputs.skip != '1' && (steps.plan.outputs.skip != '1')
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.EN_FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.EN_FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.EN_IG_USER_ID }}
        run: python -m src.en.adhkar ${{ steps.plan.outputs.args }}

      - name: Save story images
        if: steps.guard.outputs.skip != '1' && (always() && steps.plan.outputs.skip != '1')
        uses: actions/upload-artifact@v4
        with:
          name: serenity-adhkar-${{ github.run_number }}
          path: out_en_adhkar/*.jpg
          retention-days: 7

      - name: Save history
        if: steps.guard.outputs.skip != '1' && (always() && steps.plan.outputs.skip != '1')
        run: |
          if [ -n "$(git status --porcelain adhkar_history_en.json)" ]; then
            git config user.name "quran-reels-bot"
            git config user.email "actions@users.noreply.github.com"
            git add adhkar_history_en.json
            git commit -m "serenity adhkar history: ${{ github.run_number }}"
            git pull --rebase
            git push
          fi
