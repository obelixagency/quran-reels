name: Watchdog – make sure every post went out

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check every time slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: pip install requests >/dev/null && python scripts/watchdog.py
