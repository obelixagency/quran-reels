name: Watchdog – make sure every post went out

on:
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read   # state lives in Cloudflare KV; this job never pushes to git

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Load history from Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          pip install -q requests >/dev/null 2>&1 || true
          python scripts/state.py pull

      - name: Check every time slot
        env:
          GH_TOKEN: ${{ github.token }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: pip install requests >/dev/null && python scripts/watchdog.py

      - name: Share new long YouTube videos on Facebook
        if: always()
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          EN_FB_PAGE_ID: ${{ secrets.EN_FB_PAGE_ID }}
          EN_FB_PAGE_TOKEN: ${{ secrets.EN_FB_PAGE_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python scripts/promote_long.py
          python scripts/state.py push promoted_long.json   # Cloudflare KV – nothing is committed to git
