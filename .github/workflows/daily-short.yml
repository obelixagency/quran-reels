name: Daily Short – dua / hadith video (TikTok + YouTube)

on:
  schedule:
    # 09:37 UTC ≈ 12:37 Cairo (summer)
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish? (false = generate only)"
        default: "true"
      platforms:
        description: "tiktok,youtube (empty = both)"
        default: ""

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: quran-short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard (skip if this time slot already went out)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> $GITHUB_OUTPUT; exit 0; fi
          # a scheduled run that GitHub starts very late (it happens: hours late) is dropped;
          # the watchdog re-runs a missed slot at the right time instead
          CRON='${{ github.event.schedule }}'
          EXP=$(date -u -d "$(date -u +%F) $(echo "$CRON" | awk '{printf "%02d:%02d", $2, $1}')" +%s); NOW=$(date -u +%s)
          if [ "$EXP" -gt "$NOW" ]; then EXP=$((EXP - 86400)); fi
          LATE=$(( (NOW - EXP) / 60 )); echo "cron $CRON started $LATE min late"
          if [ "$LATE" -gt 90 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Too late for this time slot - skipping."; exit 0; fi
          WF=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          SINCE=$(date -u -d "@$((EXP - 600))" +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=shorts_history.json&since=$SINCE" --jq length || echo 0)
          echo "posts saved for this time slot (since $SINCE): $N"
          if [ "$N" -gt 0 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Already posted for this time slot - skipping."; else echo "skip=0" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg & Arabic text shaping
        if: steps.guard.outputs.skip != '1'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install Python packages
        if: steps.guard.outputs.skip != '1'
        run: pip install -r requirements.txt

      - name: Generate & publish short
        if: steps.guard.outputs.skip != '1'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: |
          mkdir -p out
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            python -m src.shorts
          else
            python -m src.shorts --publish --platforms "${{ inputs.platforms }}"
          fi

      - name: Save video & captions
        if: steps.guard.outputs.skip != '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            out_short/reel.mp4
            out_short/caption_*.txt
          retention-days: 7

      - name: TikTok reminder (GitHub notification with the caption)
        if: steps.guard.outputs.skip != '1' && (always())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=out_short/caption_tiktok.txt
          [ -f "$f" ] || exit 0
          { echo "## كابشن تيك توك"; echo '```'; cat "$f"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          P="${{ inputs.platforms }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then exit 0; fi
          if [ -z "$P" ] || echo "$P" | grep -q tiktok; then
            gh label create tiktok-short --color fe2c55 --repo "${{ github.repository }}" 2>/dev/null || true
            for n in $(gh issue list --label tiktok-short --state open --json number -q '.[].number' --repo "${{ github.repository }}"); do
              gh issue close "$n" --repo "${{ github.repository }}" >/dev/null || true
            done
            gh issue create --repo "${{ github.repository }}" --label tiktok-short \
              --title "📱 انشر على تيك توك (عربي – دعاء/حديث) – $(TZ=Africa/Cairo date +'%Y-%m-%d %H:%M')" --body-file "$f"
          fi

      - name: Rotate TikTok refresh token (optional, needs GH_PAT secret)
        if: steps.guard.outputs.skip != '1' && (always())
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f out/.tiktok_refresh_token ] && [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --body "$(cat out/.tiktok_refresh_token)" --repo "${{ github.repository }}"
          fi

      - name: Save history
        if: steps.guard.outputs.skip != '1' && (always())
        run: |
          if [ -n "$(git status --porcelain shorts_history.json)" ]; then
            git config user.name "quran-reels-bot"
            git config user.email "actions@users.noreply.github.com"
            git add shorts_history.json
            git commit -m "shorts history: ${{ github.run_number }}"
            git pull --rebase
            git push
          fi
