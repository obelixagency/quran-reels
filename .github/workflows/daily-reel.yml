name: Quran Reel – daily

on:
  schedule:
    # المواعيد بتوقيت UTC. مصر = UTC+3 صيفًا / UTC+2 شتاءً
    # 16:00 UTC = 7 مساءً بتوقيت القاهرة (صيفي)
    - cron: "47 15 * * *"   # ~18:47–19:15 Cairo (دقيقة غير رند عشان GitHub ميتأخرش)
    # ريل تلاوة تاني لتيك توك ويوتيوب بس ≈ 11:17 مساءً بتوقيت القاهرة (صيفي)
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to platforms? (false = generate only)"
        default: "true"
      platforms:
        description: "Comma separated (empty = all enabled in config.json)"
        default: ""
      passage:
        description: "آيات معينة (مثال imran-8) – فاضي = اختيار تلقائي"
        default: ""
      reciter:
        description: "قارئ معين (husary / minshawi / abdulbasit / tablawi) – فاضي = تلقائي"
        default: ""

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: quran-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard (skip if this time slot already went out)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> $GITHUB_OUTPUT; exit 0; fi
          # a scheduled run that GitHub starts very late (it happens: hours late) is dropped;
          # the watchdog re-runs a missed slot at the right time instead
          CRON='${{ github.event.schedule }}'
          EXP=$(date -u -d "$(date -u +%F) $(echo "$CRON" | awk '{printf "%02d:%02d", $2, $1}')" +%s); NOW=$(date -u +%s)
          if [ "$EXP" -gt "$NOW" ]; then EXP=$((EXP - 86400)); fi
          LATE=$(( (NOW - EXP) / 60 )); echo "cron $CRON started $LATE min late"
          if [ "$LATE" -gt 90 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Too late for this time slot - skipping."; exit 0; fi
          WF=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          SINCE=$(date -u -d "@$((EXP - 600))" +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=history.json&since=$SINCE" --jq length || echo 0)
          echo "posts saved for this time slot (since $SINCE): $N"
          if [ "$N" -gt 0 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Already posted for this time slot - skipping."; else echo "skip=0" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg & Arabic text shaping
        if: steps.guard.outputs.skip != '1'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install Python packages
        if: steps.guard.outputs.skip != '1'
        run: pip install -r requirements.txt

      - name: Generate & publish reel
        if: steps.guard.outputs.skip != '1'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: |
          X=""
          if [ -n "${{ inputs.passage }}" ]; then X="$X --passage ${{ inputs.passage }}"; fi
          if [ -n "${{ inputs.reciter }}" ]; then X="$X --reciter ${{ inputs.reciter }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            python -m src.main $X
          else
            P="${{ inputs.platforms }}"
            H=$((10#$(date -u +%H)))
            # الميعاد التاني بالليل: تيك توك ويوتيوب بس (فيسبوك وإنستجرام عندهم ريل واحد في اليوم)
            if [ "${{ github.event_name }}" = "schedule" ] && [ $H -ge 20 ]; then P="tiktok,youtube"; fi
            python -m src.main --publish --platforms "$P" $X
          fi

      - name: Save reel & captions (downloadable from the run page)
        if: steps.guard.outputs.skip != '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: |
            out/reel.mp4
            out/caption_*.txt
            out/plan.json
          retention-days: 14

      - name: TikTok caption (summary + GitHub notification)
        if: steps.guard.outputs.skip != '1' && (always())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=out/caption_tiktok.txt
          [ -f "$f" ] || exit 0
          { echo "## كابشن تيك توك"; echo '```'; cat "$f"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          P="${{ inputs.platforms }}"
          if [ -z "$P" ] || echo "$P" | grep -q tiktok; then
            gh label create tiktok-caption --color fe2c55 --repo "${{ github.repository }}" 2>/dev/null || true
            for n in $(gh issue list --label tiktok-caption --state open --json number -q '.[].number' --repo "${{ github.repository }}"); do
              gh issue close "$n" --repo "${{ github.repository }}" >/dev/null || true
            done
            gh issue create --repo "${{ github.repository }}" --label tiktok-caption \
              --title "📱 انشر على تيك توك (عربي – تلاوة) – $(TZ=Africa/Cairo date +'%Y-%m-%d %H:%M')" --body-file "$f"
          fi

      - name: Rotate TikTok refresh token (optional, needs GH_PAT secret)
        if: steps.guard.outputs.skip != '1' && (always())
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f out/.tiktok_refresh_token ] && [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --body "$(cat out/.tiktok_refresh_token)" --repo "${{ github.repository }}"
            echo "TikTok refresh token updated"
          fi

      - name: Save history (so آيات/خلفيات don't repeat)
        if: steps.guard.outputs.skip != '1' && (always())
        run: |
          if [ -n "$(git status --porcelain history.json)" ]; then
            git config user.name "quran-reels-bot"
            git config user.email "actions@users.noreply.github.com"
            git add history.json
            git commit -m "history: reel ${{ github.run_number }}"
            git pull --rebase
            git push
          fi
