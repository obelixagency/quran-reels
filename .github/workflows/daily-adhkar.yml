name: Daily Adhkar – stories

on:
  schedule:
    # أذكار الصباح ~06:23 القاهرة | أذكار المساء ~16:23 القاهرة (بعد العصر)
    - cron: "23 3 * * *"
    - cron: "53 3 * * *"   # backup
    - cron: "23 4 * * *"   # backup
    - cron: "23 13 * * *"
    - cron: "53 13 * * *"   # backup
    - cron: "23 14 * * *"   # backup
  workflow_dispatch:
    inputs:
      session:
        description: "morning / evening (فاضي = حسب الساعة)"
        default: ""
      publish:
        description: "Publish? (false = generate only)"
        default: "true"

permissions:
  actions: read
  contents: write

concurrency:
  group: quran-adhkar
  cancel-in-progress: false

jobs:
  guard:
    # GitHub sometimes skips or delays scheduled runs, so every time slot has 3 cron times
    # (+0 / +30 / +60 min). The first one that succeeds posts; the others stop here.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> $GITHUB_OUTPUT; exit 0; fi
          WF=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          SINCE=$(date -u -d '-150 min' +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=success&created=>=$SINCE" --jq '[.workflow_runs[] | select(.event=="schedule" or .triggering_actor.login=="github-actions[bot]")] | length' || echo 0)
          echo "successful scheduled runs since $SINCE: $N"
          if [ "$N" -gt 0 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Already posted for this time slot - skipping."; else echo "skip=0" >> $GITHUB_OUTPUT; fi

  adhkar:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Arabic text shaping
        run: sudo apt-get update && sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate & publish adhkar stories
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          S=""
          if [ -n "${{ inputs.session }}" ]; then S="--session ${{ inputs.session }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            python -m src.adhkar $S
          else
            python -m src.adhkar $S --publish
          fi

      - name: Save story images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhkar-${{ github.run_number }}
          path: out_adhkar/*.jpg
          retention-days: 7

      - name: Save history
        if: always()
        run: |
          if [ -n "$(git status --porcelain adhkar_history.json)" ]; then
            git config user.name "quran-reels-bot"
            git config user.email "actions@users.noreply.github.com"
            git add adhkar_history.json
            git commit -m "adhkar history: ${{ github.run_number }}"
            git pull --rebase
            git push
          fi
