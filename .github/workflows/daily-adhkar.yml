name: Daily Adhkar – stories

on:
  schedule:
    # أذكار الصباح ~06:23 القاهرة | أذكار المساء ~16:23 القاهرة (بعد العصر)
    - cron: "23 3 * * *"
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: "morning / evening (فاضي = حسب الساعة)"
        default: ""
      publish:
        description: "Publish? (false = generate only)"
        default: "true"

permissions:
  actions: read
  contents: write

concurrency:
  group: quran-adhkar
  cancel-in-progress: false

jobs:
  adhkar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard (skip if this time slot already went out)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> $GITHUB_OUTPUT; exit 0; fi
          # a scheduled run that GitHub starts very late (it happens: hours late) is dropped;
          # the watchdog re-runs a missed slot at the right time instead
          CRON='${{ github.event.schedule }}'
          EXP=$(date -u -d "$(date -u +%F) $(echo "$CRON" | awk '{printf "%02d:%02d", $2, $1}')" +%s); NOW=$(date -u +%s)
          if [ "$EXP" -gt "$NOW" ]; then EXP=$((EXP - 86400)); fi
          LATE=$(( (NOW - EXP) / 60 )); echo "cron $CRON started $LATE min late"
          if [ "$LATE" -gt 90 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Too late for this time slot - skipping."; exit 0; fi
          WF=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          SINCE=$(date -u -d '-150 min' +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=success&created=>=$SINCE" --jq '[.workflow_runs[] | select(.event=="schedule" or .triggering_actor.login=="github-actions[bot]")] | length' || echo 0)
          echo "successful scheduled runs since $SINCE: $N"
          if [ "$N" -gt 0 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Already posted for this time slot - skipping."; else echo "skip=0" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Arabic text shaping
        if: steps.guard.outputs.skip != '1'
        run: sudo apt-get update && sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b

      - name: Install Python packages
        if: steps.guard.outputs.skip != '1'
        run: pip install -r requirements.txt

      - name: Generate & publish adhkar stories
        if: steps.guard.outputs.skip != '1'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          S=""
          if [ -n "${{ inputs.session }}" ]; then S="--session ${{ inputs.session }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            python -m src.adhkar $S
          else
            python -m src.adhkar $S --publish
          fi

      - name: Save story images
        if: steps.guard.outputs.skip != '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: adhkar-${{ github.run_number }}
          path: out_adhkar/*.jpg
          retention-days: 7

      - name: Save history
        if: steps.guard.outputs.skip != '1' && (always())
        run: |
          if [ -n "$(git status --porcelain adhkar_history.json)" ]; then
            git config user.name "quran-reels-bot"
            git config user.email "actions@users.noreply.github.com"
            git add adhkar_history.json
            git commit -m "adhkar history: ${{ github.run_number }}"
            git pull --rebase
            git push
          fi
