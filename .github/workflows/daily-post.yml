name: Daily Post – dua / hadith

on:
  schedule:
    # 07:00 UTC = 10 صباحًا بتوقيت القاهرة (صيفي)
    - cron: "47 6 * * *"   # ~09:47–10:15 Cairo
    - cron: "17 7 * * *"   # backup
    - cron: "47 7 * * *"   # backup
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish? (false = generate only)"
        default: "true"

permissions:
  actions: read
  contents: write

concurrency:
  group: quran-post
  cancel-in-progress: false

jobs:
  guard:
    # GitHub sometimes skips or delays scheduled runs, so every time slot has 3 cron times
    # (+0 / +30 / +60 min). The first one that succeeds posts; the others stop here.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> $GITHUB_OUTPUT; exit 0; fi
          # a scheduled run that GitHub starts very late (it happens: hours late) is dropped;
          # the watchdog re-runs a missed slot at the right time instead
          CRON='${{ github.event.schedule }}'
          EXP=$(date -u -d "$(date -u +%F) $(echo "$CRON" | awk '{printf "%02d:%02d", $2, $1}')" +%s); NOW=$(date -u +%s)
          if [ "$EXP" -gt "$NOW" ]; then EXP=$((EXP - 86400)); fi
          LATE=$(( (NOW - EXP) / 60 )); echo "cron $CRON started $LATE min late"
          if [ "$LATE" -gt 90 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Too late for this time slot - skipping."; exit 0; fi
          WF=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          SINCE=$(date -u -d '-150 min' +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=success&created=>=$SINCE" --jq '[.workflow_runs[] | select(.event=="schedule" or .triggering_actor.login=="github-actions[bot]")] | length' || echo 0)
          echo "successful scheduled runs since $SINCE: $N"
          if [ "$N" -gt 0 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Already posted for this time slot - skipping."; else echo "skip=0" >> $GITHUB_OUTPUT; fi

  post:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Arabic text shaping
        run: sudo apt-get update && sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate & publish post
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            python -m src.posts
          else
            python -m src.posts --publish
          fi

      - name: Save post image & captions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_number }}
          path: |
            out_post/post.jpg
            out_post/story.jpg
            out_post/slide_*.jpg
            out_post/caption_*.txt
          retention-days: 14

      - name: Save history
        if: always()
        run: |
          if [ -n "$(git status --porcelain posts_history.json)" ]; then
            git config user.name "quran-reels-bot"
            git config user.email "actions@users.noreply.github.com"
            git add posts_history.json
            git commit -m "posts history: ${{ github.run_number }}"
            git pull --rebase
            git push
          fi
