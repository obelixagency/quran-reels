name: Insights report (Facebook / Instagram / YouTube, read-only)

# Reads the numbers of every published post (nothing is posted) and keeps stats.json +
# insights_report.md up to date in the repo. Runs every day and can be started by hand.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read   # state lives in Cloudflare KV; this job never pushes to git

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load history from Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          pip install -q requests >/dev/null 2>&1 || true
          python scripts/state.py pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read insights + capability check
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          EN_FB_PAGE_ID: ${{ secrets.EN_FB_PAGE_ID }}
          EN_FB_PAGE_TOKEN: ${{ secrets.EN_FB_PAGE_TOKEN }}
          EN_IG_USER_ID: ${{ secrets.EN_IG_USER_ID }}
          EN_IG_TOKEN: ${{ secrets.EN_IG_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          EN_YT_CLIENT_ID: ${{ secrets.EN_YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          EN_YT_CLIENT_SECRET: ${{ secrets.EN_YT_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
          EN_YT_REFRESH_TOKEN: ${{ secrets.EN_YT_REFRESH_TOKEN }}
        run: pip install -q requests && python scripts/insights.py
      - name: Save stats.json + insights_report.md
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/state.py push stats.json insights_report.md   # Cloudflare KV – nothing is committed to git
