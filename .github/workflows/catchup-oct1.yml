name: One-off catch-up (Oct 1, 2026) – done

# Nothing left to do: the missed EN reel of Sep 30 was already posted by the watchdog (Oct 1, 01:15 UTC).
# Kept only as a manual "re-enable the watchdog" button.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable watchdog.yml -R "${{ github.repository }}"
