name: TikTok check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprints (no secret values printed)
        env:
          RT: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          RES=$(curl -s -X POST https://open.tiktokapis.com/v2/oauth/token/ \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_key=$KEY" --data-urlencode "client_secret=$SECRET" \
            --data-urlencode "grant_type=refresh_token" --data-urlencode "refresh_token=$RT")
          echo "$RES" | jq '{has_access: (.access_token != null), same_refresh: (.refresh_token == env.RT)}'
